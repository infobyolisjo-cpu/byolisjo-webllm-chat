<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByOlisJo Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Geist', sans-serif;
      background-color: #ffffff;
      background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
      background-size: 32px 32px;
      color: #37352F;
      min-height: 100vh;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    .toplink {
      display: inline-block;
      background: #37352F;
      color: #ffffff;
      padding: 8px 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      border-radius: 8px;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
      transition: opacity 0.15s;
    }
    .toplink:hover { opacity: 0.85; }

    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: #37352F;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .chat {
      border: 1px solid #E6E6E4;
      border-radius: 12px;
      padding: 16px;
      background: #FCFCFB;
    }

    .chat-header {
      font-size: 13px;
      font-weight: 600;
      color: #8B8B85;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    #chatBox {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #E6E6E4;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      background: #ffffff;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #chatBox::-webkit-scrollbar {
      width: 4px;
    }
    #chatBox::-webkit-scrollbar-track {
      background: transparent;
    }
    #chatBox::-webkit-scrollbar-thumb {
      background: #E6E6E4;
      border-radius: 2px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .msg-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #8B8B85;
    }

    .msg-body {
      font-size: 14px;
      line-height: 1.65;
      color: #37352F;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .msg-label { color: #37352F; }
    .msg.user .msg-body  { color: #37352F; }

    .msg.bot .msg-label  { color: #8B8B85; }

    /* Typing indicator */
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 0;
    }
    .typing-dots span {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #8B8B85;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-4px); }
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #userInput {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #E6E6E4;
      background: #ffffff;
      color: #37352F;
      font-family: 'Geist', sans-serif;
      font-size: 14px;
      transition: border-color 0.15s;
    }
    #userInput::placeholder { color: #8B8B85; }
    #userInput:focus {
      outline: none;
      border-color: #37352F;
    }
    #userInput:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .send {
      flex-shrink: 0;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #37352F;
      color: #ffffff;
      font-family: 'Geist', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .send:hover:not(:disabled) { opacity: 0.85; }
    .send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="toplink" href="https://byolisjo.com">ByOlisJo</a>

    <h1>🚀 Bienvenido a ByOlisJo</h1>

    <div class="chat">
      <div class="chat-header">💬 Chat ByOlisJo</div>
      <div id="chatBox"></div>
      <div class="input-row">
        <input id="userInput" type="text" placeholder="Escribe tu mensaje aquí...">
        <button class="send" onclick="sendMessage()">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    let history = [];

    const chatBox   = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn   = document.querySelector(".send");

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function addMessage(role, content) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;

      const label = document.createElement("div");
      label.className = "msg-label";
      label.textContent = role === "user" ? "Tú" : "Bot";

      const body = document.createElement("div");
      body.className = "msg-body";
      body.textContent = content;

      wrap.appendChild(label);
      wrap.appendChild(body);
      chatBox.appendChild(wrap);
      wrap.scrollIntoView({ block: "end", behavior: "smooth" });
      return wrap;
    }

    function addTypingIndicator() {
      const wrap = document.createElement("div");
      wrap.className = "msg bot";

      const label = document.createElement("div");
      label.className = "msg-label";
      label.textContent = "Bot";

      const body = document.createElement("div");
      body.className = "msg-body";
      body.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

      wrap.appendChild(label);
      wrap.appendChild(body);
      chatBox.appendChild(wrap);
      wrap.scrollIntoView({ block: "end", behavior: "smooth" });
      return wrap;
    }

    function setLoading(on) {
      userInput.disabled = on;
      sendBtn.disabled   = on;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage("user", text);
      userInput.value = "";
      setLoading(true);

      const typingEl = addTypingIndicator();

      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history })
        });

        const data  = await r.json();
        const reply = data.reply || "No pude responder. Intenta de nuevo.";

        typingEl.remove();
        addMessage("bot", reply);

        history.push({ role: "user",      content: text  });
        history.push({ role: "assistant", content: reply });

      } catch {
        typingEl.querySelector(".msg-body").textContent = "⚠️ Error de conexión. Intenta otra vez.";
      } finally {
        setLoading(false);
        userInput.focus();
      }
    }

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Render the initial bot message
    addMessage("bot", `Hola, ya has dado un paso importante con tu Diagnóstico IA.\n\nAhora vamos a convertir esa información en claridad y acción, a tu ritmo.\n\n¿Cómo te gustaría avanzar ahora?\n\n1) Crear mi Kit de Marca IA\n\n2) Hablar de mi idea (dudas, enfoque y prioridades)\n\n3) No estoy segura — guíame con 3 preguntas rápidas`);
  </script>
</body>
</html>
